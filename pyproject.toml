[project]
name = "phishing-website-detection"
version = "0.1.0"
description = "Classify a website as phishing or legitimate from 30 coded indicators, served with FastAPI."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.5",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "requests>=2.34.2",
]
notebook = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]

[tool.uv]
default-groups = ["dev", "notebook"]
